<style id="css">
/* Layout: blush boutique. Mihrab-arch frames, a woven basket that collects picks, one rose accent with soft gold details */
:root{
  --bg:#FBF3F4; --surface:#FFFFFF; --ink:#12382A; --muted:#7D6670; --brand:#0B3324; --brand-ink:#FBEFF2; --logo-filter:none; --line:#F0D9DF;
  --accent:#C2577A; --accent-2:#F3C6D3; --accent-ink:#FFFFFF; --gold:#A9834B; --soft:#F7E3E8;
  --ok:#3E7D5A; --warn:#B0661C; --bad:#A33A4A; --shadow:rgba(122,40,72,.14);
  --display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1419;--surface:#27191F;--ink:#F6E7EC;--muted:#C4A6B3;--brand:#A9D9BE;--brand-ink:#0B2419;--logo-filter:invert(1) hue-rotate(180deg) brightness(1.15);--line:#3E2A33;
  --accent:#F08DAE;--accent-2:#6E3550;--accent-ink:#2A0F1B;--gold:#E3C28A;--soft:#33212A;
  --ok:#8FD3AC;--warn:#F0B26A;--bad:#F09AA6;--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1419;--surface:#27191F;--ink:#F6E7EC;--muted:#C4A6B3;--brand:#A9D9BE;--brand-ink:#0B2419;--logo-filter:invert(1) hue-rotate(180deg) brightness(1.15);--line:#3E2A33;
  --accent:#F08DAE;--accent-2:#6E3550;--accent-ink:#2A0F1B;--gold:#E3C28A;--soft:#33212A;
  --ok:#8FD3AC;--warn:#F0B26A;--bad:#F09AA6;--shadow:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.05}
em{font-style:italic;color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:auto;filter:var(--logo-filter)}
.brand .lm{height:40px}.brand .lw{height:26px}
.flogo{width:180px;filter:var(--logo-filter)}
.heromark{position:absolute;inset:0;display:grid;place-items:center;padding:18%;background:radial-gradient(circle at 50% 40%,var(--surface),var(--soft))}
.heromark img{width:100%;filter:var(--logo-filter)}
@media (max-width:420px){.brand .lw{height:20px}.brand .lm{height:32px}}
.brand span{font-family:var(--display);font-size:28px;font-weight:600;font-style:italic}
nav.links{display:flex;gap:20px;margin-left:auto}
nav.links a{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
nav.links a:hover{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
@media (max-width:700px){nav.links{display:none}.iconbtn{margin-left:auto}}

/* hero */
.hero{position:relative;padding-block:40px 24px;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.hero::before{content:"";position:absolute;inset:-40px -10% auto auto;width:520px;height:520px;max-width:100%;border-radius:50%;background:radial-gradient(circle,var(--accent-2),transparent 68%);opacity:.8;z-index:-1;pointer-events:none}
.hero h1{font-size:clamp(40px,6.4vw,76px);margin-top:10px}
.hero p{max-width:46ch;color:var(--muted);font-size:17px;margin:16px 0 22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.heroimg{position:relative;justify-self:end;width:min(440px,100%)}
.heroimg .arch{aspect-ratio:4/5;box-shadow:0 30px 60px var(--shadow)}
.sticker{position:absolute;left:-14px;bottom:36px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;box-shadow:0 10px 24px var(--shadow);display:flex;gap:8px;align-items:center}
.sticker i{font-style:normal;color:var(--accent)}
.heroempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-weight:700;font-size:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-block:24px 8px}.heroimg{justify-self:center}.sticker{left:6px}}

.banner{background:var(--soft);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:16px}

/* quote widget */
.quote{background:linear-gradient(140deg,var(--surface),var(--soft));border:1px solid var(--line);border-radius:22px;padding:18px 20px 16px;box-shadow:0 18px 40px var(--shadow);display:grid;gap:8px}
.quote .qhead{display:flex;justify-content:space-between;align-items:center}
.quote blockquote{margin:0;font-family:var(--display);font-size:21px;font-style:italic;line-height:1.25;transition:opacity .5s ease}
.quote cite{font-style:normal;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.06em;transition:opacity .5s ease}
.quote .fade{opacity:0}
.qdots{display:flex;gap:5px}
.qdots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.qdots span.on{background:var(--accent)}
.qmin{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:50%}
.qopen{display:none}
.quoteband{padding-block:8px 4px}
@media (min-width:900px){
  .quoteband{padding:0}
  .quote{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:300px;z-index:25;animation:hover 6s ease-in-out infinite}
  .quote.min{display:none}
  .qopen{display:grid;position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:25;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-family:var(--display);font-size:30px;place-items:center;box-shadow:0 10px 24px var(--shadow);animation:hover 6s ease-in-out infinite}
  .qopen[hidden]{display:none}
}
@media (max-width:899px){.qmin{display:none}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* sections */
section{padding-block:30px}
.sechead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.sechead h2{font-size:clamp(32px,4.4vw,46px)}

/* combos */
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px 22px;margin-bottom:20px}
.offer{min-height:230px;background:linear-gradient(90deg,var(--brand) 0%,color-mix(in srgb,var(--brand) 85%,transparent) 42%,transparent 78%),var(--banner,none) 70% 35%/cover no-repeat,var(--brand)}
@media (max-width:600px){.offer{padding-top:190px;background:linear-gradient(0deg,var(--brand) 45%,color-mix(in srgb,var(--brand) 40%,transparent) 70%,transparent 100%),var(--banner,none) 65% 20%/cover no-repeat,var(--brand)}}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.igt{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;display:block;background:var(--soft);color:inherit;text-decoration:none}
.igt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.igt:hover img{transform:scale(1.05)}
.igt::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(40,12,26,.35),transparent 45%);opacity:0;transition:opacity .3s}
.igt:hover::after{opacity:1}
.igfollow{display:grid;place-items:center;text-align:center;align-content:center;gap:8px;padding:14px;background:linear-gradient(140deg,var(--accent-2),var(--soft));border:1px solid var(--line)}
.igfollow svg{width:34px;height:34px;color:var(--accent)}
.igfollow strong{font-family:var(--display);font-size:22px;font-weight:600}
.igfollow span{font-size:13px;font-weight:800;color:var(--brand)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:62px;border:2px solid transparent;border-radius:12px;padding:0;background:none;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.arch .alt{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;pointer-events:none}
.card:hover .arch .alt{opacity:1}
.ctag{position:absolute;left:10px;top:22%;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.galed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.galed > div{display:grid;gap:4px}
.galed img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.galed input{padding:6px 8px!important;font-size:13px}
.social{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:31}
body.owner .social{bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.sbub{position:relative;width:64px;height:64px;border-radius:50%;padding:3px;border:0;background:conic-gradient(from 200deg,var(--accent),var(--gold),var(--brand),var(--accent));box-shadow:0 14px 30px var(--shadow);animation:hover 5s ease-in-out infinite}
.sbub video,.sbub img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--surface)}
.sbadges{position:absolute;left:-6px;bottom:-4px;display:flex}
.sbadges i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-right:-6px}
.sbadges i:first-child{color:var(--accent)}
.sbadges svg{width:13px;height:13px}
.spanel{display:none;position:absolute;right:0;bottom:76px;width:min(300px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;gap:10px;box-shadow:0 24px 50px var(--shadow);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.social.open .spanel{display:grid}
@media (hover:hover){.social:hover .spanel{display:grid}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.spanel .phead{display:flex;justify-content:space-between;align-items:center}
.spanel .phead strong{font-family:var(--display);font-size:22px}
.stt{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--soft);text-decoration:none}
.stt video{width:100%;height:100%;object-fit:cover;display:block}
.stt span{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(15,10,14,.72);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.stt span svg{width:15px;height:15px;flex:none}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sig a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden}
.sig img{width:100%;height:100%;object-fit:cover;display:block}
.slinks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slinks a{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 8px;font-weight:800;font-size:12px;color:var(--ink);text-decoration:none;min-width:0;overflow:hidden;white-space:nowrap}
.slinks svg{width:14px;height:14px;flex:none}
.slinks a:first-child svg{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.sbub{animation:none}}
.catdesc{margin:-8px 0 20px;color:var(--muted);font-size:14px;max-width:62ch;min-height:1.6em}
.catdesc b{color:var(--ink)}
.revphoto{padding:0;overflow:hidden;position:relative;min-height:320px;grid-row:span 2}
.revphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.revphoto figcaption{position:absolute;left:12px;right:12px;bottom:12px;background:color-mix(in srgb,var(--surface) 90%,transparent);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;color:var(--ink)}
.revphoto figcaption span{display:block;font-weight:600;font-size:12px;color:var(--muted)}
@media (max-width:600px){.revphoto{grid-row:auto;min-height:420px}}
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:0 20px 50px var(--shadow)}
.cpanel{background:var(--brand);color:var(--brand-ink);padding:32px;display:grid;gap:14px;align-content:start}
.cpanel .eyebrow{color:var(--accent-2)}
.cpanel h2{font-size:clamp(34px,4.4vw,48px);color:var(--brand-ink)}
.cpanel h2 em{color:var(--accent-2)}
.cpanel p{margin:0;opacity:.85;max-width:38ch}
.cways{display:grid;gap:10px;margin-top:6px}
.cway{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--brand-ink);text-decoration:none;transition:background .2s,transform .2s;min-width:0}
.cway:hover{background:rgba(255,255,255,.16);transform:translateX(3px)}
.cway i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-ink);color:var(--brand)}
.cway i svg{width:20px;height:20px}
.cway b{display:block;font-size:15px}
.cway small{display:block;opacity:.75;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cway span:last-child{opacity:.6;font-size:18px}
.cform{padding:32px;display:grid;gap:4px;align-content:start}
.cform h3{font-family:var(--display);font-size:28px;margin:0}
.cform > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.contact .f input,.contact .f select,.contact .f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
.contact .f input:focus,.contact .f select:focus,.contact .f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.contact .f .send{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.contact .f .send small{color:var(--muted)}
@media (max-width:820px){.contact{grid-template-columns:1fr}.cpanel,.cform{padding:22px}}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.cstatus{border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--soft)}
@media (max-width:720px){.contact{grid-template-columns:1fr;padding:20px}}
.rname{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink)}
.rev .row .extag{align-self:center}
.consent{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 20px 50px var(--shadow);display:grid;gap:10px;font-size:14px}
.consent p{margin:0;color:var(--muted)}
.consent a{color:var(--ink)}
.consent .row{justify-content:flex-end}
.celebrate{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px);animation:celfade .3s ease}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.celcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 26px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 30px 70px var(--shadow);animation:celpop .55s cubic-bezier(.3,1.6,.5,1)}
.celcard svg{width:150px;height:auto;display:block;margin:-70px auto 4px;overflow:visible}
.celcard h2{font-size:34px;margin:4px 0 2px}
.celcard p{margin:6px 0 16px;color:var(--muted)}
.celcard .ref{font-weight:800;color:var(--ink)}
.bagbody{transform-origin:75px 150px;animation:bagbob 1.1s ease-in-out infinite}
.armL{transform-origin:22px 92px;animation:waveL .5s ease-in-out infinite alternate}
.armR{transform-origin:128px 92px;animation:waveR .5s ease-in-out infinite alternate}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3s infinite}
.heart{animation:floatup 2.4s ease-in infinite;opacity:0}
.heart.h2{animation-delay:.8s}.heart.h3{animation-delay:1.6s}
@keyframes celfade{from{opacity:0}}
@keyframes celpop{from{transform:scale(.6) translateY(30px);opacity:0}}
@keyframes bagbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes waveL{from{transform:rotate(10deg)}to{transform:rotate(-35deg)}}
@keyframes waveR{from{transform:rotate(-10deg)}to{transform:rotate(35deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes floatup{0%{transform:translateY(10px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.celcard,.bagbody,.armL,.armR,.eye,.heart{animation:none}.heart{opacity:1}}
.howgrid{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:28px;align-items:center}
.howgrid .steps{grid-template-columns:1fr}
@media (max-width:720px){.howgrid{grid-template-columns:1fr}.howgrid .arch{max-width:280px;justify-self:center}}
.ask{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:32px;align-items:center;background:var(--soft);border-radius:28px;padding:28px}
.ask h2{font-size:clamp(32px,4.4vw,46px)}
.ask p{color:var(--muted);margin:10px 0 18px;max-width:42ch}
@media (max-width:640px){.ask{grid-template-columns:1fr;padding:20px}.ask .arch{max-width:260px;justify-self:center}}
.offer .big{font-family:var(--display);font-size:52px;font-weight:600;line-height:1}
.offer p{margin:0;font-weight:600}
.offer small{opacity:.85}
@media (max-width:600px){.offer{grid-template-columns:1fr}}
.combos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.combo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0}
.trio{display:flex;justify-content:center;padding-block:6px}
.trio .mini{width:84px;aspect-ratio:3/4;border-radius:999px 999px 8px 8px / 42% 42% 8px 8px;overflow:hidden;border:3px solid var(--surface);margin-left:-18px;box-shadow:0 8px 18px var(--shadow)}
.trio .mini:first-child{margin-left:0;transform:rotate(-6deg)}
.trio .mini:last-child{transform:rotate(6deg)}
.trio .mini img{width:100%;height:100%;object-fit:cover;display:block}
.combo h3{font-size:26px}
.combo .list{color:var(--muted);font-size:13px}
.strike{text-decoration:line-through;color:var(--muted);font-weight:600;margin-right:6px}

/* shop */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-left:auto;font-weight:700}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 22px}
@media (max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.card .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.arch .open{height:100%}
.arch{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:999px 999px 14px 14px / 42% 42% 14px 14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.arch img,.arch video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .arch img{transform:scale(1.04)}
.card.sold .arch img{filter:grayscale(.7) opacity(.6)}
.tag{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.newtag{position:absolute;right:10px;top:22%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.reftag{position:absolute;left:50%;transform:translateX(-50%);top:30%;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.quick{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:800;line-height:1;box-shadow:0 8px 16px var(--shadow);transition:transform .2s ease}
.quick:hover{transform:scale(1.1)}
.quick:active{transform:scale(.9)}
.card h3{font-size:22px;line-height:1.1}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800}
.stock{font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok)}.s-low{color:var(--warn)}.s-out{color:var(--bad)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.stars{color:var(--gold);letter-spacing:2px}
.rev p{margin:0;font-family:var(--display);font-size:20px;font-style:italic;line-height:1.3}
.rev small{color:var(--muted)}
.extag{align-self:flex-start;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.revsum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.revsum strong{font-family:var(--display);font-size:52px;font-weight:600;line-height:1}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.step h3{font-size:24px;margin-bottom:4px}
.step p{margin:0;color:var(--muted)}

footer{border-top:1px solid var(--line);margin-top:24px}
footer{background:var(--surface)}
footer .fgrid{padding-block:40px 24px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;color:var(--muted);font-size:14px}
.fbrand .flogo{width:170px}
.fbrand p{margin:12px 0 0;line-height:1.7}
.fcol{display:grid;gap:8px;align-content:start;min-width:0}
.fcol h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.fcol a{text-decoration:none;font-weight:700}.fcol a:hover{color:var(--accent)}
#footEmail{display:grid;gap:8px}
footer .fbar{padding-block:14px 120px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
footer .fbar .linkbtn{font-size:13px}
@media (max-width:720px){footer .fgrid{grid-template-columns:1fr 1fr}.fbrand{grid-column:1/-1}}
.quote.away,.qopen.away{opacity:0;pointer-events:none;transform:translateY(20px)}
.quote,.qopen{transition:opacity .35s,transform .35s}
footer a{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:800;border:1px solid transparent;text-decoration:none;transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 22px var(--shadow)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-wa{background:#1F8F55;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:7px 14px;font-size:13px}

/* the basket */
.basket{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0}
.basket .bowl{position:relative;width:76px;height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 34px var(--shadow);display:grid;place-items:end center;padding-bottom:14px;color:var(--accent)}
.basket svg{width:46px;height:40px;position:relative;z-index:2}
.basket .picks{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;z-index:1}
.basket .picks img{width:20px;height:28px;object-fit:cover;border-radius:999px 999px 3px 3px / 40% 40% 3px 3px;border:2px solid var(--surface);margin-left:-6px}
.basket .picks img:first-child{margin-left:0;transform:rotate(-14deg)}
.basket .picks img:nth-child(3){transform:rotate(14deg)}
.basket .badge{position:absolute;top:2px;right:2px;z-index:3;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;padding:0 6px;font-size:12px;font-weight:800;display:grid;place-items:center}
.basket .tot{background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 10px 22px var(--shadow);order:-1}
.basket .tot small{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75;line-height:1.2}
.basket.bump .bowl{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
.flyer{position:fixed;z-index:70;object-fit:cover;border-radius:999px 999px 12px 12px / 40% 40% 12px 12px;pointer-events:none;box-shadow:0 20px 40px var(--shadow)}
body.owner .basket{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.owner .quote,body.owner .qopen{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(40,12,26,.4);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:50;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;gap:14px;overflow:auto;box-shadow:-20px 0 50px var(--shadow);border-radius:24px 0 0 24px;animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.drawer.wide{width:min(780px,100%)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhead h2{font-size:32px}
.x{border:1px solid var(--line);background:transparent;border-radius:999px;width:38px;height:38px;font-size:18px;line-height:1;flex:none}
.modal{position:fixed;z-index:50;inset:auto 0 0 0;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(880px,92vw);border-radius:24px}}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.pd > *{min-width:0}
@media (max-width:640px){.pd{grid-template-columns:1fr}.pd .arch{max-height:52vh;aspect-ratio:auto;height:52vh}}
.pd h2{font-size:38px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:800}
.size[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:transparent;width:34px;height:34px;font-size:18px}
.qty span{min-width:24px;text-align:center;font-weight:800}

.edit{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.edit img{width:56px;height:72px;object-fit:cover;border-radius:999px 999px 6px 6px / 40% 40% 6px 6px;flex:none;border:2px solid var(--soft);animation:dropin .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dropin{from{transform:translateY(-24px) scale(.6);opacity:0}}
.meter{display:grid;gap:6px;background:var(--soft);border-radius:14px;padding:12px 14px}
.meter .bar{height:10px;border-radius:999px;background:var(--surface);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter strong{font-size:14px}
.meter.won{background:var(--accent);color:var(--accent-ink)}
.meter.won .bar{background:rgba(255,255,255,.35)}
.meter.won .bar i{background:var(--accent-ink)}
.line{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.line img{width:60px;height:78px;object-fit:cover;border-radius:999px 999px 6px 6px / 40% 40% 6px 6px}
.line > div{min-width:0}
.line select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 6px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.sum{display:grid;gap:4px}
.sum .row{font-weight:700}
.sum .disc{color:var(--accent)}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:8px}

form.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:400;color:var(--ink);width:100%}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:480px){.f .two,.f .three{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px}
.okbox{background:var(--soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.okbox pre{white-space:pre-wrap;margin:0;font-family:var(--body);font-size:13px;max-height:220px;overflow:auto;background:var(--surface);padding:10px;border-radius:10px}
.copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyline code{background:var(--surface);padding:3px 8px;border-radius:6px;user-select:all}

/* owner tools */
.ownerbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ownerbar span{margin-right:auto;font-size:14px;font-weight:700}
.ownerbar .btn-ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.alist{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:48px 1fr 110px 80px auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.arow img{width:48px;height:62px;object-fit:cover;border-radius:999px 999px 4px 4px / 40% 40% 4px 4px}
.arow > div{min-width:0}
.arow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%}
@media (max-width:600px){.arow{grid-template-columns:48px 1fr 1fr}.arow .acts{grid-column:1/-1;justify-self:end}}
.acts{display:flex;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.checks input{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:80;font-weight:800;font-size:14px;box-shadow:0 10px 30px var(--shadow);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
body.owner{padding-bottom:70px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<template id="shell">
<header class="top"><div class="wrap">
  <a class="brand" href="/" id="brand" aria-label="Baya By Baker home"></a>
  <nav class="links"><a href="#combos">Trio offers</a><a href="#shop">Shop</a><a href="#reviews">Reviews</a><a href="#insta">Instagram</a><a href="#how">How to order</a><a href="#contact">Contact</a></nav>
  <button class="iconbtn" id="soundBtn" type="button" aria-label="Sound on"></button>
</div></header>
<main>
  <div class="wrap hero">
    <div>
      <div class="eyebrow">Aura · Modest · Luxe</div>
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
      <div class="ctas"><a class="btn btn-primary" href="#shop">Shop the rail</a><a class="btn btn-ghost" href="#combos">See trio offers</a></div>
    </div>
    <div class="heroimg"><div class="arch" id="heroArch"></div><div class="sticker"><i>✦</i> New pieces every week</div></div>
  </div>
  <div class="wrap quoteband">
    <aside class="quote" id="quote" aria-live="polite">
      <div class="qhead"><span class="eyebrow">Words for her</span><button class="qmin" id="qmin" type="button" aria-label="Hide quotes">×</button></div>
      <blockquote id="qtext"></blockquote><cite id="qcite"></cite><div class="qdots" id="qdots"></div>
    </aside>
    <button class="qopen" id="qopen" type="button" aria-label="Show quotes" hidden>❝</button>
  </div>
  <section id="combos"><div class="wrap">
    <div class="sechead"><h2>Trio <em>offers</em></h2></div>
    <div class="offer" id="offer"></div>
    <div class="combos" id="comboGrid"></div>
  </div></section>
  <section id="shop"><div class="wrap">
    <div id="sampleNote"></div>
    <div class="sechead"><h2>On the <em>rail</em> now</h2><span class="meta num" id="countNote"></span></div>
    <div class="filters" id="filters"></div>
    <p class="catdesc" id="catDesc" aria-live="polite"></p><div class="grid" id="grid"></div>
  </div></section>
  <section id="reviews"><div class="wrap">
    <div class="sechead"><h2>Loved by <em>our sisters</em></h2><div id="googleCta"></div></div>
    <div class="revsum" id="revsum"></div>
    <div class="revs" id="revs"></div>
  </div></section>
  <section id="insta"><div class="wrap">
    <div class="sechead"><h2>On our <em>Instagram</em></h2><div class="row"><a class="btn btn-ghost btn-sm" id="ttBtn" target="_blank" rel="noopener" hidden>TikTok</a><a class="btn btn-ghost btn-sm" id="igBtn" target="_blank" rel="noopener">Follow</a></div></div>
    <div class="igrid" id="igGrid"></div>

function tween(el,from,to){
  if(reduce||from===to){el.textContent=ugx(to);return}
  var t0=performance.now(),d=700;
  (function step(now){var k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=ugx(from+(to-from)*e);if(k<1)requestAnimationFrame(step)})(t0);
}

function flyTo(srcEl,url){
  var b=$('#basket .bowl');
  if(!srcEl||!b||reduce)return Promise.resolve();
  var a=srcEl.getBoundingClientRect(),z=b.getBoundingClientRect();
  if(!a.width)return Promise.resolve();
  var w=Math.min(a.width,180),h=w*4/3;
  var x0=a.left+a.width/2-w/2,y0=a.top+a.height/2-h/2;
  var el=document.createElement('img');el.src=url;el.className='flyer';el.alt='';
  el.style.cssText='left:'+x0+'px;top:'+y0+'px;width:'+w+'px;height:'+h+'px';
  document.body.appendChild(el);
  var dx=z.left+z.width/2-(x0+w/2),dy=z.top+z.height/2-(y0+h/2);
  var anim=el.animate([
    {transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
    {transform:'translate('+dx*.45+'px,'+(dy*.45-170)+'px) scale(.5) rotate(-14deg)',opacity:1,offset:.5},
    {transform:'translate('+dx+'px,'+dy+'px) scale(.1) rotate(10deg)',opacity:.7}
  ],{duration:820,easing:'cubic-bezier(.45,0,.3,1)'});
  return anim.finished.then(function(){el.remove()},function(){el.remove()});
}

function sendOrderEmail(d,ref,c,msg){
  var s=state.settings,box=$('#mailStatus',d);
  if(!s.orderEndpoint||!/^https:$/.test(location.protocol)||/claude|anthropic/.test(location.hostname)||!window.fetch)return;
  var t=totals();
  box.hidden=false;box.textContent='Sending your order to Baya By Baker…';
  var items=cart.map(function(l){var p=byId(l.id);return p.name+(l.colour?' ('+l.colour+')':'')+(l.size?', length '+l.size+'"':'')+' x'+l.qty+' = '+ugx(p.price*l.qty)}).join('\n');
  fetch(s.orderEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({
    _subject:'New order '+ref+' from '+c.name,_template:'box',_captcha:'false',
    Reference:ref,Name:c.name,Phone:c.phone,Delivery:c.area,Notes:c.notes||'-',Items:items,
    Subtotal:ugx(t.sub),Discount:t.won?('-'+ugx(t.disc)+' (trio offer)'):'none',Total:ugx(t.total)+' (delivery fee to confirm)'})})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return r.ok&&String(j.success)==='true'})})
  .then(function(ok){box.innerHTML=ok?'<strong>✓ Order received by email.</strong> We\'ll confirm on WhatsApp. Sending it there too gets you a faster reply.':'We couldn\'t send your order automatically. Please send it on WhatsApp below.'})
  .catch(function(){box.textContent='We couldn\'t send your order automatically. Please send it on WhatsApp below.'});
}

function shrink(file,max,q,png,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    var x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
    cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q));
  };im.onerror=function(){toast('That file could not be read as an image')};im.src=r.result};
  r.readAsDataURL(file);
}

}

  var a=e.target.closest('a[href*="wa.me"]');if(a)track('whatsapp',cart.map(function(l){return {id:l.id,qty:l.qty}}));
  if(e.target.closest('#cookieSettings'))showConsent(true);
});

cleanCart();paintSound();paintQuote();setQuoteMin(qMin);renderAll();showConsent(false);
if('IntersectionObserver' in window){var seen=new Set();var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)seen.add(e.target);else seen.delete(e.target)});var away=seen.size>0;$('#quote').classList.toggle('away',away);$('#qopen').classList.toggle('away',away)},{threshold:0.05});['#contact','footer'].forEach(function(q){var el=$(q);if(el)io.observe(el)})}
if(!reduce)qTimer=setInterval(nextQuote,7000);else qTimer=setInterval(nextQuote,12000);

if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var u=r[0];artifactNS=r[1];
    if(!u||!artifactNS)return;
    return u.canEdit().then(function(ok){isOwner=!!ok;renderAll()});
  }).catch(function(){});
}
})();
</script>
